[project]
name = "newsletter-archive"
version = "0.1.0"
description = "Parses incoming newsletter emails and publishes them as permalinked archive pages."
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Only needed for the local sqlite3 dev server / CLI path (newsletter_archive/web/app.py
# via `uvicorn ... --reload`) -- not used by the deployed Cloudflare Worker.
local = [
    "uvicorn[standard]>=0.32",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[dependency-groups]
# Cloudflare's Python Workers CLI (pywrangler) and runtime SDK -- see worker_entry.py.
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsletter_archive"]
